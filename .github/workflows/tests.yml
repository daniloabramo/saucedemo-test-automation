name: Run Selenium Tests with Allure

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install allure-pytest

      - name: Run Selenium tests
        run: |
          pytest --alluredir=allure-results
        continue-on-error: true

      - name: Install Allure CLI
        run: |
          wget -qO allure.tgz \
            https://github.com/allure-framework/allure2/releases/latest/download/allure-2.35.1.tgz
          sudo tar -zxf allure.tgz -C /opt/
          sudo ln -s /opt/allure-2.35.1/bin/allure /usr/local/bin/allure

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results \
            --clean \
            --output allure-report

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

  deploy:
    if: always()
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4